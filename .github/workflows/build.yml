name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: .\installer\build.ps1 -BuildNumber ${{ github.run_number }} -InstallWinFsp

      - uses: actions/upload-artifact@v7
        with:
          name: WinCasc-setup
          path: artifacts/installer/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} (Get-ChildItem artifacts/installer/*.exe).FullName --title ${{ github.ref_name }} --generate-notes
