name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: .\installer\build.ps1 -BuildNumber ${{ github.run_number }} -InstallWinFsp

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Item artifacts/publish/WinCasc.exe).VersionInfo.FileVersion
          gh release create "v$version" (Get-ChildItem artifacts/installer/*.exe).FullName --title "WinCasc $version" --target $env:GITHUB_SHA --generate-notes
